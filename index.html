<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Challenge 100 Días</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .exercise-tab.active {
            background-color: rgba(255, 255, 255, 0.1);
            border-bottom: 3px solid currentColor;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <header class="glass sticky top-0 z-40 mb-6">
        <div class="max-w-4xl mx-auto p-4">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-800 tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">
                    MULTI-CHALLENGE 100
                </h1>
                <div id="streak-badge" class="flex items-center gap-2 bg-orange-500/20 text-orange-400 px-3 py-1 rounded-full border border-orange-500/30">
                    <span class="text-sm">🔥</span>
                    <span id="streak-count" class="font-bold">0</span>
                </div>
            </div>
            
            <nav class="flex overflow-x-auto gap-2 no-scrollbar pb-2">
                <button onclick="switchExercise('flexiones')" id="tab-flexiones" class="exercise-tab active px-4 py-2 rounded-t-lg text-sm font-semibold whitespace-nowrap text-cyan-400">Flexiones</button>
                <button onclick="switchExercise('abdominales')" id="tab-abdominales" class="exercise-tab px-4 py-2 rounded-t-lg text-sm font-semibold whitespace-nowrap text-emerald-400">Abdominales</button>
                <button onclick="switchExercise('sentadillas')" id="tab-sentadillas" class="exercise-tab px-4 py-2 rounded-t-lg text-sm font-semibold whitespace-nowrap text-yellow-400">Sentadillas</button>
                <button onclick="switchExercise('pesa_rusa')" id="tab-pesa_rusa" class="exercise-tab px-4 py-2 rounded-t-lg text-sm font-semibold whitespace-nowrap text-purple-400">Pesa Rusa</button>
                <button onclick="switchExercise('remo')" id="tab-remo" class="exercise-tab px-4 py-2 rounded-t-lg text-sm font-semibold whitespace-nowrap text-pink-400">Remo TRX</button>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 space-y-8">
        
        <section class="glass rounded-3xl p-6 flex flex-col md:flex-row items-center justify-around gap-6">
            <div class="relative w-32 h-32">
                <svg class="w-full h-full">
                    <circle class="text-slate-800" stroke-width="6" stroke="currentColor" fill="transparent" r="58" cx="64" cy="64"/>
                    <circle id="progress-circle" class="text-cyan-500 progress-ring__circle" stroke-width="6" stroke-dasharray="364" stroke-dashoffset="364" stroke-linecap="round" stroke="currentColor" fill="transparent" r="58" cx="64" cy="64"/>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span id="percent-text" class="text-2xl font-bold">0%</span>
                </div>
            </div>
            
            <div class="text-center md:text-left space-y-2 flex-1">
                <h2 id="exercise-title" class="text-2xl font-bold">Flexiones</h2>
                <p id="progress-description" class="text-slate-400 text-sm">Cargando meta...</p>
                <div class="flex gap-4 pt-2 justify-center md:justify-start">
                    <div>
                        <p class="text-xl font-bold" id="total-reps">0</p>
                        <p class="text-[9px] uppercase text-slate-500 tracking-widest">Reps Totales</p>
                    </div>
                    <div class="h-8 w-px bg-slate-800"></div>
                    <div>
                        <p class="text-xl font-bold" id="days-completed">0</p>
                        <p class="text-[9px] uppercase text-slate-500 tracking-widest">Días Listos</p>
                    </div>
                </div>
            </div>
        </section>

        <section id="today-section" class="space-y-4">
            <div id="workout-card" class="bg-gradient-to-br from-cyan-600 to-blue-700 rounded-3xl p-6 shadow-xl transition-all duration-500">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h4 id="today-day-title" class="text-3xl font-black italic">DÍA 1</h4>
                        <p id="today-instruction" class="text-white/80 text-sm">Series recomendadas:</p>
                    </div>
                    <div id="exercise-icon" class="bg-white/20 p-3 rounded-2xl text-2xl">💪</div>
                </div>

                <div id="sets-container" class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6"></div>

                <button id="complete-btn" class="w-full bg-white text-slate-900 font-bold py-4 rounded-2xl shadow-lg hover:scale-[1.02] transition-transform active:scale-95">
                    MARCAR COMO COMPLETADO
                </button>
            </div>
        </section>

        <section class="space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-widest text-slate-500 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                Historial del reto
            </h3>
            <div id="calendar-grid" class="grid grid-cols-7 sm:grid-cols-10 gap-2"></div>
        </section>

    </main>

    <div id="modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass max-w-sm w-full p-8 rounded-3xl text-center space-y-6 border-cyan-500/50">
            <div class="text-6xl animate-bounce">🏆</div>
            <h2 class="text-2xl font-bold">¡Objetivo Cumplido!</h2>
            <button onclick="closeModal()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-bold py-4 rounded-2xl">SIGUIENTE NIVEL</button>
        </div>
    </div>

    <script>
        const EXERCISES = {
            flexiones: { name: "Flexiones", target: 100, start: 10, color: "cyan", icon: "💪", gradient: "from-cyan-600 to-blue-700" },
            abdominales: { name: "Abdominales", target: 200, start: 20, color: "emerald", icon: "🧘", gradient: "from-emerald-600 to-teal-700" },
            sentadillas: { name: "Sentadillas", target: 150, start: 15, color: "yellow", icon: "🦵", gradient: "from-yellow-600 to-orange-700" },
            pesa_rusa: { name: "Pesa Rusa", target: 100, start: 10, color: "purple", icon: "⚙️", gradient: "from-purple-600 to-indigo-700" },
            remo: { name: "Remo TRX", target: 80, start: 8, color: "pink", icon: "⚓", gradient: "from-pink-600 to-rose-700" }
        };

        let currentExerciseKey = 'flexiones';
        let appData = { exercises: {} };

        Object.keys(EXERCISES).forEach(key => {
            appData.exercises[key] = { completedDays: [], totalReps: 0, lastDate: null, streak: 0 };
        });

        function loadData() {
            const saved = localStorage.getItem('multi_challenge_100_v2');
            if (saved) {
                const parsed = JSON.parse(saved);
                Object.keys(parsed.exercises).forEach(key => {
                    if (appData.exercises[key]) appData.exercises[key] = parsed.exercises[key];
                });
            }
            updateUI();
        }

        function saveData() { localStorage.setItem('multi_challenge_100_v2', JSON.stringify(appData)); }

        function switchExercise(key) {
            currentExerciseKey = key;
            document.querySelectorAll('.exercise-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${key}`).classList.add('active');
            updateUI();
        }

        function getWorkoutForDay(day, key) {
            if (day % 7 === 0) return { type: 'rest', sets: [] };
            const ex = EXERCISES[key];
            let total = Math.floor(ex.start + (day - 1) * ((ex.target - ex.start) / 99));
            let numSets = day < 30 ? 5 : (day < 70 ? 4 : 3);
            let sets = Array(numSets).fill(Math.ceil(total / numSets));
            return { type: 'sets', sets };
        }

        function updateUI() {
            const exCfg = EXERCISES[currentExerciseKey];
            const exData = appData.exercises[currentExerciseKey];
            const currentDay = (() => {
                for(let i=1; i<=100; i++) if(!exData.completedDays.includes(i)) return i;
                return 100;
            })();
            const workout = getWorkoutForDay(currentDay, currentExerciseKey);

            document.getElementById('exercise-title').innerText = exCfg.name;
            document.getElementById('progress-description').innerText = `Meta: ${exCfg.target} repeticiones el día 100.`;
            document.getElementById('streak-count').innerText = exData.streak || 0;
            document.getElementById('total-reps').innerText = exData.totalReps;
            document.getElementById('days-completed').innerText = exData.completedDays.length;
            document.getElementById('exercise-icon').innerText = exCfg.icon;

            const percent = exData.completedDays.length;
            const circle = document.getElementById('progress-circle');
            circle.style.strokeDashoffset = 364 - (percent / 100 * 364);
            circle.className = `text-${exCfg.color}-500 progress-ring__circle`;
            document.getElementById('percent-text').innerText = `${percent}%`;
            document.getElementById('workout-card').className = `bg-gradient-to-br ${exCfg.gradient} rounded-3xl p-6 shadow-xl transition-all duration-500`;

            const container = document.getElementById('sets-container');
            container.innerHTML = '';
            document.getElementById('today-day-title').innerText = `DÍA ${currentDay}`;

            if (workout.type === 'rest') {
                document.getElementById('today-instruction').innerText = "Descanso activo";
                container.innerHTML = `<div class="col-span-full text-center py-4 bg-white/10 rounded-xl">Recupera y estira.</div>`;
            } else {
                document.getElementById('today-instruction').innerText = "Series recomendadas:";
                workout.sets.forEach((r, i) => {
                    container.innerHTML += `<div class="bg-white/20 p-4 rounded-2xl text-center border border-white/10">
                        <p class="text-[10px] opacity-60">S${i+1}</p><p class="text-2xl font-bold">${r}</p>
                    </div>`;
                });
            }

            const cal = document.getElementById('calendar-grid');
            cal.innerHTML = '';
            for(let i=1; i<=100; i++) {
                const done = exData.completedDays.includes(i);
                const isRest = i % 7 === 0;
                cal.innerHTML += `<div class="aspect-square flex items-center justify-center rounded-lg text-[10px] font-bold border ${
                    done ? `bg-${exCfg.color}-500 border-transparent text-white` : 
                    (i === currentDay ? 'bg-white text-slate-900 scale-110' : 'bg-slate-900 border-slate-800 text-slate-600')
                }">${isRest && !done ? '💤' : i}</div>`;
            }

            const btn = document.getElementById('complete-btn');
            if (exData.completedDays.includes(currentDay)) {
                btn.innerText = "¡COMPLETADO!";
                btn.disabled = true;
                btn.className = "w-full bg-slate-800 text-slate-500 font-bold py-4 rounded-2xl cursor-not-allowed";
            } else {
                btn.innerText = "MARCAR COMO COMPLETADO";
                btn.disabled = false;
                btn.className = "w-full bg-white text-slate-900 font-bold py-4 rounded-2xl shadow-lg hover:scale-105 transition-all";
            }
        }

        document.getElementById('complete-btn').onclick = () => {
            const exData = appData.exercises[currentExerciseKey];
            const day = (() => {
                for(let i=1; i<=100; i++) if(!exData.completedDays.includes(i)) return i;
                return 100;
            })();
            const workout = getWorkoutForDay(day, currentExerciseKey);
            exData.completedDays.push(day);
            exData.totalReps += workout.sets.reduce((a,b) => a+b, 0);
            exData.streak++;
            saveData(); updateUI(); showModal();
        };

        function showModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        window.onload = loadData;
    </script>
</body>
</html>
